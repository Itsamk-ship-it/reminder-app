application:
  name: swift-nova-reminder-app
  pods:
    - name: app
      image: "# filled by pipeline"
      path: /
      servicePorts:
        - 3000
      vars:
        - key: PORT
          value: "3000"
        - key: BACKEND_POD_URL
          value: "http://localhost:8000"
        - key: DATABASE_URL
          value: "postgresql://postgres:password@${db:5432}/reminders"
        - key: DEBUG
          value: "true"
        - key: VAPI_API_KEY
          value: "44e00ee8-6d04-4b1b-9f1d-c849ccdb5d7f"
        - key: VAPI_ASSISTANT_ID
          value: "0fc412e4-04de-43ae-834c-6a6701aeb092"
        - key: VAPI_PHONE_NUMBER_ID
          value: "d414f198-c8c6-448f-a36e-39c20e90f5dd"
        - key: TWILIO_ACCOUNT_SID
          value: ""
        - key: TWILIO_AUTH_TOKEN
          value: ""
        - key: TWILIO_PHONE_NUMBER
          value: ""
    - name: db
      image: mirror.gcr.io/library/postgres:16-alpine
      path: /db
      servicePorts:
        - 5432
      vars:
        - key: POSTGRES_USER
          value: postgres
        - key: POSTGRES_PASSWORD
          value: password
        - key: POSTGRES_DB
          value: reminders
